<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>건국대학교병원 약제부</title>
    <meta name="color-scheme" content="light dark" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%233b82f6'/%3E%3Cpath d='M12 7v10M7 12h10' stroke='white' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <link rel="stylesheet" href="design-kit/tokens.css" />
    <link rel="stylesheet" href="design-kit/components.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="kp-topbar" aria-label="상단 메뉴">
      <a class="brand" href="./index.html" aria-label="건국대학교병원 약제부 홈">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M12 6v12M6 12h12" /></svg>
        </span>
        <span>
          <strong>건국대학교병원</strong>
          <small>약제부</small>
        </span>
      </a>
      <div class="top-actions">
        <time class="clock" id="clock" aria-label="현재 시각"></time>
        <span class="profile-chip" aria-hidden="true">약</span>
      </div>
    </header>

    <main>
      <section class="hero" aria-labelledby="page-title">
        <div class="hero-main">
          <p class="kp-eyebrow">Konkuk University Medical Center</p>
          <h1 id="page-title" class="kp-h1">약제부 업무 포털</h1>
          <p class="hero-date" id="heroDate"></p>
          <div class="hero-stats" id="heroStats" aria-hidden="true"></div>
        </div>
        <div class="hero-mark" aria-hidden="true">
          <span class="hero-mark-shape hero-mark-shape--a">
            <svg viewBox="0 0 24 24"><path d="M10 3v6l-5 8a3 3 0 0 0 2.6 4.5h8.8A3 3 0 0 0 19 17l-5-8V3" /><path d="M8 3h8" /></svg>
          </span>
          <span class="hero-mark-shape hero-mark-shape--b">
            <svg viewBox="0 0 24 24"><path d="M5 11h14" /><path d="M12 4v14" /></svg>
          </span>
          <span class="hero-mark-shape hero-mark-shape--c">
            <svg viewBox="0 0 24 24"><path d="M4 19h16" /><path d="M7 19v-6" /><path d="M12 19V6" /><path d="M17 19v-9" /></svg>
          </span>
        </div>
      </section>

      <div class="tabs" role="tablist" aria-label="화면 선택">
        <button class="tab is-active" id="tabPortal" role="tab" aria-selected="true" type="button">업무포털</button>
        <button class="tab" id="tabPersonal" role="tab" aria-selected="false" type="button">개인</button>
      </div>

      <div id="panelPortal">
        <label class="search-box kp-input" aria-label="바로가기 검색">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="11" cy="11" r="7" />
            <path d="m20 20-3.8-3.8" />
          </svg>
          <input id="portalSearch" type="search" placeholder="업무 또는 바로가기 검색" />
          <kbd aria-hidden="true">/</kbd>
        </label>

        <section class="department-grid" id="departmentGrid" aria-live="polite"></section>
        <p class="empty-state" id="emptyState" hidden>검색 결과가 없습니다.</p>
      </div>

      <section class="personal" id="panelPersonal" hidden aria-label="개인 공간">
        <form class="lock kp-card" id="lockForm" autocomplete="off">
          <strong>개인 공간</strong>
          <p>비밀번호를 입력하세요.</p>
          <div class="lock-row">
            <input id="pinInput" type="password" inputmode="numeric" autocomplete="off" placeholder="비밀번호" aria-label="비밀번호" />
            <button class="kp-btn kp-btn--primary" type="submit">열기</button>
          </div>
          <p class="lock-msg" id="lockMsg" role="alert"></p>
        </form>

        <div class="personal-body kp-card" id="personalBody" hidden>
          <div class="card-top">
            <div>
              <p class="card-kicker">Personal</p>
              <h3>개인 바로가기</h3>
            </div>
            <div class="personal-actions">
              <button class="kp-btn kp-btn--secondary" id="editBtn" type="button">편집</button>
              <button class="kp-btn kp-btn--secondary" id="lockBtn" type="button">잠그기</button>
            </div>
          </div>
          <div class="link-list personal-links" id="personalLinks"></div>
          <p class="personal-empty" id="personalEmpty" hidden>아직 바로가기가 없습니다. 편집을 눌러 추가하세요.</p>
          <form class="personal-add" id="addForm" hidden autocomplete="off">
            <input id="addLabel" type="text" placeholder="이름" maxlength="20" aria-label="이름" required />
            <input id="addHref" type="text" inputmode="url" placeholder="주소 (https://…)" aria-label="주소" required />
            <button class="kp-btn kp-btn--primary" type="submit">추가</button>
          </form>
          <p class="personal-note" id="personalNote"></p>
        </div>
      </section>
    </main>

    <footer class="credit">chateaud.</footer>

    <script src="script.js"></script>
  </body>
</html>
